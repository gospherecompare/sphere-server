name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - project: client
            dir: client
            lint: true
            build: true
            testCommand: ""
          - project: client_1
            dir: client_1
            lint: true
            build: true
            testCommand: ""
          - project: frontend
            dir: frontend
            lint: true
            build: true
            testCommand: ""
          - project: server
            dir: server
            lint: false
            build: false
            testCommand: npm test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: ${{ matrix.dir }}
        run: npm install

      - name: Lint
        if: ${{ matrix.lint }}
        working-directory: ${{ matrix.dir }}
        run: npm run lint

      - name: Build
        if: ${{ matrix.build }}
        working-directory: ${{ matrix.dir }}
        run: npm run build

      - name: Test
        if: ${{ matrix.testCommand != '' }}
        working-directory: ${{ matrix.dir }}
        run: ${{ matrix.testCommand }}
